name: Validate portfolio evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python src/pipeline.py --generate
      - run: python scripts/check_artifacts.py
      - run: python src/build_powerbi.py --check
      - run: git diff --exit-code -- index.html projects/ start/PowerBI-pronto.zip
      - run: git diff --exit-code -- data/
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.65.1
      - run: python -m playwright install --with-deps chromium
      - name: Start static site and check visitor flows
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          python -c "import urllib.request,time; time.sleep(1); urllib.request.urlopen('http://127.0.0.1:8080/')"
          python scripts/browser_check.py --screenshots /tmp/portfolio-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: /tmp/portfolio-qa/
  spark-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install pyspark==4.0.1 delta-spark==4.0.1 nbclient nbformat ipykernel
      - run: python src/build_notebook.py
      - run: python src/execute_notebook.py
      - uses: actions/upload-artifact@v4
        with:
          name: spark-delta-evidence
          path: evidence/
