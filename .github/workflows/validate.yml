name: Validate portfolio evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/decision.test.mjs
      - run: python src/incremental_lakehouse.py --check
      - run: python src/pipeline.py --generate
      - run: git diff --exit-code -- data/
      - run: pip install -r projects/bigquery/requirements.txt
      - run: python projects/bigquery/verify_locally.py --check
  spark-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install pyspark==4.0.1 delta-spark==4.0.1 nbclient nbformat ipykernel
      - run: python src/build_notebook.py
      - run: python src/execute_notebook.py
      - run: python src/incremental_lakehouse.py --verify-delta --check
      - uses: actions/upload-artifact@v4
        with:
          name: spark-delta-evidence
          path: evidence/
